# Production configuration. Every value raised from its default carries a
# one-line reason.

# Console and Markers
CONFIG_PRINTK=y
# Markers are printed with printk: synchronous, unlike the deferred log path
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_BOOT_BANNER=n
# the Zephyr boot banner is noise before the [BOOT] marker

# Reset reason
CONFIG_HWINFO=y

# Drivers used by the Self-test and the User LED
CONFIG_PWM=y
CONFIG_GPIO=y

# Diagnostics other than Markers go through the log subsystem
CONFIG_LOG=y
CONFIG_LOG_PRINTK=n
# default y routes printk into the deferred log thread: Markers must stay synchronous

# Watchdog: one task-watchdog channel (5 s), hardware watchdog as fallback
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_HW_FALLBACK=y
CONFIG_TASK_WDT_CHANNELS=2
# default 5; one channel is used (spec), 2 is the Kconfig range minimum
# CONFIG_TASK_WDT_MIN_TIMEOUT stays at its default 100 ms: the task watchdog's own
# timer feeds the hardware watchdog every 100 ms and the hardware window is that
# plus 20 ms, so an interrupts-off stretch or timer stall over about 120 ms resets
# the board (the 5 s window only governs the main loop's feed)
CONFIG_REBOOT=y
# already selected by TASK_WDT; explicit because the expiry callback calls sys_reboot()

# Bluetooth: peripheral only, one Connection, NUS service (ticket 06)
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
# spec: one Connection, so two pages never fight over the User LED
CONFIG_BT_ZEPHYR_NUS=y
# the Shell link (ADR-0001) rides on the upstream Nordic UART Service
CONFIG_BT_DEVICE_NAME="XIAO-C6-LED"
# the Web App and the Harness find the board by this name; ble.c prints the same string
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
# ATT MTU 247 (spec): L2CAP MTU 247 plus the 4-byte L2CAP header in each ACL buffer;
# defaults are 23 and 27

# Stack headroom with Bluetooth running (measured with the thread analyzer, see board-notes):
CONFIG_MAIN_STACK_SIZE=3072
# default 2048; bt_enable() runs on the main thread and peaked at 1632 bytes
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
# default 768; the log thread peaked at 724 with the Bluetooth stack logging (94 %)

# Shells (ticket 07): the serial console shell and the Shell link's own instance (src/shell_nus.c)
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_LOG_BACKEND=n
# neither shell is a log backend: diagnostics stay on the UART log backend, so Markers and
# <wrn>/<err> lines reach the console independently of a shell and never enter the Shell link
CONFIG_LOG_BACKEND_UART=y
CONFIG_SHELL_MSG_CMD_NOT_FOUND=y
# an unknown command prints "<cmd>: command not found" instead of nothing, so a typo on the
# serial shell is visible (default n once SHELL_BACKEND_SERIAL is set)
# Each shell instance runs a thread with the default CONFIG_SHELL_STACK_SIZE=2048; measured with
# the thread analyzer: shell_nus peaked at 1312 (64 %), shell_uart at 612 (29 %), see board-notes.
