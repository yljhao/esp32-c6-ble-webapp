# Production configuration. Every value raised from its default carries a
# one-line reason.

# Console and Markers
CONFIG_PRINTK=y
# Markers are printed with printk: synchronous, unlike the deferred log path
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_BOOT_BANNER=n
# the Zephyr boot banner is noise before the [BOOT] marker

# Reset reason
CONFIG_HWINFO=y

# Drivers used by the Self-test and the User LED
CONFIG_PWM=y
CONFIG_GPIO=y

# Diagnostics other than Markers go through the log subsystem
CONFIG_LOG=y
CONFIG_LOG_PRINTK=n
# default y routes printk into the deferred log thread: Markers must stay synchronous

# Watchdog: one task-watchdog channel (5 s), hardware watchdog as fallback
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_HW_FALLBACK=y
CONFIG_TASK_WDT_CHANNELS=2
# default 5; one channel is used (spec), 2 is the Kconfig range minimum
CONFIG_REBOOT=y
# sys_reboot() is the bounded fallback in the channel's expiry callback
