# Stack and heap headroom scenario (ticket 06). Merged with
#   C6_BUILD_DIR=build-analyze C6_EXTRA_CONF=analyze.conf ./build.sh build|flash
# in a build directory of its own, so the production build never carries it. The thread
# analyzer prints every thread's stack use to the console; debug_heap.c prints the kernel heap.
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_PRINTK=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=5
CONFIG_THREAD_NAME=y
# the analyzer prints thread names only with this
CONFIG_C6_HEAP_REPORT=y
