# Debug overlay (never part of the production image). Merged with
#   C6_BUILD_DIR=<dir> C6_EXTRA_CONF=debug.conf ./build.sh build|flash
# in a build directory of its own, so the production build never carries it.

# The serial shell carries the debug command. Production has no shell yet;
# later tickets add the console shell to prj.conf, and these lines then stay
# harmless duplicates.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_LOG_BACKEND=n
# keep diagnostics on the UART log backend so Markers and <wrn>/<err> lines
# reach the console independently of the shell
CONFIG_LOG_BACKEND_UART=y

# "debug hang": the main loop stops feeding the watchdog (ticket 04)
CONFIG_C6_HANG_CMD=y
